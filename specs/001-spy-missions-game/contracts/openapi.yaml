openapi: 3.0.3
info:
  title: Spy Missions API (Games)
  version: 1.0.0
paths:
  /api/v1/games:
    post:
      summary: Create a new game
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commander_id:
                  type: string
                mode:
                  type: string
                config:
                  type: object
                  properties:
                    maxPlayers:
                      type: integer
                    resourceTick:
                      type: string
                    endCondition:
                      type: object
                playerInvites:
                  type: array
                  items:
                    type: string
                startImmediately:
                  type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  status:
                    type: string
                  players:
                    type: array
                    items:
                      type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/games/{gameId}:
    get:
      summary: Get game status
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game details
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
